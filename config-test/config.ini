; LAN Time Sync 测试配置 — 指向本机测试 SNTP 服务器(端口 123)。
; 正式使用请把 address 换成你局域网内的时间服务器,并复制到
; %ProgramData%\LANTimeSync\config.ini

[server]
address = "192.168.1.100"   ; ← 改成你的 NTP 服务器
port = 123

[sync]
interval_minutes = 60        ; 常规重同步周期(分钟)
retry_seconds = 10           ; 失败后重试间隔(秒)
timeout_ms = 2000            ; 每次请求超时(毫秒)
max_offset_ms = 5000         ; 偏差超过它才强制校正
min_offset_ms = 200          ; 低于它视为“已准”(免写)
force_enabled = true
force_flag = true            ; 激进:小幅漂移也校
sync_on_start = true         ; 启动即同步一次

[service]
; true  = 作为 Windows 服务运行(SYSTEM 权限,可改系统时间)
; false = 托盘常驻(改时间需通过提权辅助)
enabled = false

[log]
file_enabled = false
level = "debug"
